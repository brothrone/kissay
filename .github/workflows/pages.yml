# web/ 폴더의 화면을 GitHub Pages로 배포한다.
# Pages에는 서버가 없으므로 API 키를 쓰지 않는다. 자동으로 채우기는 무료체험 서버를 쓴다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp web/*.js web/*.json _site/
          {
            printf '%s' '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>'
            cat web/index.html
            printf '%s' '</body></html>'
          } > _site/index.html
          # 배포할 때마다 스크립트 주소에 버전을 붙여, 새 화면이 예전에 받아 둔 스크립트와 섞이지 않게 한다.
          sed -i -E "s#<script src=\"([a-z0-9-]+\.js)\"#<script src=\"\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -c "?v=${GITHUB_SHA::7}" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
